<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자회:이기다 - 공지사항 커스텀 빌더</title>
    <link rel="icon" href="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--bg-color); color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; color: #f8fafc; }
        .header p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.3rem; }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 2rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 1.8rem; }
        .panel-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.2rem; color: var(--accent-color); display: flex; align-items: center; gap: 0.5rem; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full-width { grid-column: span 2; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 0.4rem; font-weight: 600; }
        input[type="text"], input[type="date"], textarea, select {
            width: 100%; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 0.75rem; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        input[type="color"] { width: 100%; height: 42px; background: none; border: none; cursor: pointer; }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); }
        textarea { height: 110px; resize: vertical; line-height: 1.5; }

        /* 미리보기 영역 */
        .preview-wrapper { position: sticky; top: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .preview-box {
            width: 100%; max-width: 440px; background: #1e293b; border-radius: 24px; padding: 2rem; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .preview-badge { display: inline-block; padding: 0.25rem 0.8rem; font-size: 0.75rem; font-weight: 700; border-radius: 20px; margin-bottom: 1rem; text-transform: uppercase; }
        .preview-icon { font-size: 3rem; margin-bottom: 0.5rem; line-height: 1; }
        .preview-title { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 0.8rem; }
        .preview-content { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; text-align: left; background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 12px; margin-bottom: 1.2rem; max-height: 200px; overflow-y: auto; }
        .preview-btn { width: 100%; border: none; padding: 0.85rem; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; }

        .btn-copy { width: 100%; margin-top: 1.2rem; background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; border: none; padding: 1rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: white; padding: 0.8rem 1.8rem; border-radius: 30px; font-weight: 600; opacity: 0; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.4); z-index: 99; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛠️ 자회:이기다 - 공지 커스텀 Builder</h1>
        <p>공지사항의 스타일, 테마, 문구를 실시간으로 설정하고 텍스트 코드를 생성하세요.</p>
    </div>

    <div class="container">
        <!-- 설정 폼 -->
        <div class="panel">
            <div class="panel-title">⚙️ 1. 기본 정보 설정</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>배지 텍스트 (카테고리)</label>
                    <input type="text" id="badgeText" value="중요 공지" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>아이콘 선택</label>
                    <select id="noticeIcon" onchange="updatePreview()">
                        <option value="📢">📢 공지사항 (마이크)</option>
                        <option value="🚨">🚨 긴급 점검 (사이렌)</option>
                        <option value="🎉">🎉 이벤트/업데이트 (폭죽)</option>
                        <option value="👾">👾 패치 노트 (게임)</option>
                        <option value="🎁">🎁 보상 지급 (선물)</option>
                        <option value="⚖️">⚖️ 이용약관 변경 (저울)</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>공지 제목</label>
                    <input type="text" id="noticeTitle" value="[업데이트] 자회:이기다 v2.0 오픈 안내" oninput="updatePreview()">
                </div>
                <div class="form-group full-width">
                    <label>공지 본문 내용 (엔터/줄바꿈 가능)</label>
                    <textarea id="noticeContent" oninput="updatePreview()">안녕하세요. 개발팀입니다.
새로운 미니게임 2종이 추가되었습니다!

- 신규 게임: '숫자 맞추기', '카드 뒤집기'
- 데이터 자동 백업 시스템 도입
- UI 디자인 대규모 개편

항상 이용해 주셔서 감사합니다!</textarea>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 1.5rem;">🎨 2. 디자인 & 스타일 커스텀</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>테마 강조 색상</label>
                    <input type="color" id="themeColor" value="#38bdf8" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>배경 모달 색상</label>
                    <input type="color" id="modalBgColor" value="#1e293b" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>테두리 효과 스타일</label>
                    <select id="borderStyle" onchange="updatePreview()">
                        <option value="glow">네온 반짝임 (Glow)</option>
                        <option value="solid">일반 테두리 (Solid)</option>
                        <option value="gradient">그라데이션 (Gradient)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>아이콘 애니메이션</label>
                    <select id="iconAnim" onchange="updatePreview()">
                        <option value="pulse">두근두근 (Pulse)</option>
                        <option value="bounce">통통 튀기 (Bounce)</option>
                        <option value="none">없음 (None)</option>
                    </select>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 1.5rem;">🔗 3. 버튼 & 게시 기간 설정</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>버튼 문구</label>
                    <input type="text" id="btnText" value="확인했습니다" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label>버튼 클릭 시 이동 URL (선택사항)</label>
                    <input type="text" id="btnLink" placeholder="예: https://naver.com (빈칸 시 단순 닫기)" oninput="updatePreview()">
                </div>
                <div class="form-group full-width">
                    <label>공지 게시 종료일 (선택시 지정일 이후 자동 숨김)</label>
                    <input type="date" id="expireDate" oninput="updatePreview()">
                </div>
            </div>

            <button class="btn-copy" onclick="copyGeneratedCode()">📋 코드 복사 (announcement.txt에 붙여넣기)</button>
        </div>

        <!-- 실시간 미리보기 -->
        <div class="preview-wrapper">
            <h3 style="color: #cbd5e1; margin-bottom: 1rem;">👁️ 실시간 미리보기</h3>
            <div class="preview-box" id="prevBox">
                <div class="preview-badge" id="prevBadge">중요 공지</div>
                <div class="preview-icon" id="prevIcon">📢</div>
                <div class="preview-title" id="prevTitle">제목</div>
                <div class="preview-content" id="prevContent">내용</div>
                <button class="preview-btn" id="prevBtn">확인했습니다</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ 생성 코드가 클립보드에 복사되었습니다!</div>

    <script>
        function updatePreview() {
            const badge = document.getElementById('badgeText').value;
            const icon = document.getElementById('noticeIcon').value;
            const title = document.getElementById('noticeTitle').value;
            const content = document.getElementById('noticeContent').value;
            const color = document.getElementById('themeColor').value;
            const bg = document.getElementById('modalBgColor').value;
            const borderStyle = document.getElementById('borderStyle').value;
            const iconAnim = document.getElementById('iconAnim').value;
            const btnText = document.getElementById('btnText').value;

            // DOM 적용
            const prevBox = document.getElementById('prevBox');
            const prevBadge = document.getElementById('prevBadge');
            const prevIcon = document.getElementById('prevIcon');
            const prevBtn = document.getElementById('prevBtn');

            document.getElementById('prevTitle').innerText = title;
            document.getElementById('prevContent').innerHTML = content.replace(/\n/g, '<br>');
            prevBadge.innerText = badge;
            prevIcon.innerText = icon;
            prevBtn.innerText = btnText;

            // 스타일 적용
            prevBox.style.backgroundColor = bg;
            prevBadge.style.backgroundColor = color + '25';
            prevBadge.style.color = color;
            prevBadge.style.border = `1px solid ${color}60`;
            prevBtn.style.backgroundColor = color;

            if (borderStyle === 'glow') {
                prevBox.style.boxShadow = `0 20px 50px rgba(0,0,0,0.6), 0 0 30px ${color}50`;
                prevBox.style.border = `1px solid ${color}80`;
            } else if (borderStyle === 'gradient') {
                prevBox.style.boxShadow = `0 20px 50px rgba(0,0,0,0.6)`;
                prevBox.style.border = `2px solid ${color}`;
            } else {
                prevBox.style.boxShadow = `0 20px 50px rgba(0,0,0,0.6)`;
                prevBox.style.border = `1px solid rgba(255,255,255,0.15)`;
            }

            // 애니메이션
            prevIcon.style.transition = 'transform 0.3s ease';
            if (iconAnim === 'bounce') {
                prevIcon.style.animation = 'bounce 1s infinite alternate';
            } else if (iconAnim === 'pulse') {
                prevIcon.style.animation = 'pulse 1.5s infinite alternate';
            } else {
                prevIcon.style.animation = 'none';
            }
        }

        function copyGeneratedCode() {
            const data = {
                badge: document.getElementById('badgeText').value,
                icon: document.getElementById('noticeIcon').value,
                title: document.getElementById('noticeTitle').value,
                content: document.getElementById('noticeContent').value,
                themeColor: document.getElementById('themeColor').value,
                modalBgColor: document.getElementById('modalBgColor').value,
                borderStyle: document.getElementById('borderStyle').value,
                iconAnim: document.getElementById('iconAnim').value,
                btnText: document.getElementById('btnText').value,
                btnLink: document.getElementById('btnLink').value.trim(),
                expireDate: document.getElementById('expireDate').value,
                updatedAt: new Date().toISOString()
            };

            const jsonString = JSON.stringify(data, null, 2);

            navigator.clipboard.writeText(jsonString).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        }

        // 키프레임 애니메이션 삽입
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
            @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
        `;
        document.head.appendChild(styleSheet);

        updatePreview();
    </script>
</body>
</html>
