<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자회:이기다 | JAHOE:WIN</title>
    <link rel="icon" href="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/maingamebackgroundimg.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; z-index: -2;
        }
        .bg-dim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.65) 0%, rgba(15, 23, 42, 0.88) 100%); backdrop-filter: blur(6px); z-index: -1; }

        header { padding: 3rem 1rem 1.8rem; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo-container { position: relative; margin-bottom: 1.2rem; cursor: pointer; }
        .logo-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110px; height: 110px; background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, rgba(168, 85, 247, 0.3) 70%, transparent 100%); border-radius: 50%; filter: blur(15px); animation: pulseGlow 3s infinite alternate; }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        .logo-img { position: relative; width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .logo-container:hover .logo-img { transform: scale(1.12) rotate(15deg); }

        .main-title-kr { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-title-en { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: 6px; color: #94a3b8; margin-bottom: 0.8rem; }
        .sub-title { font-size: 1rem; color: #cbd5e1; background: rgba(30, 41, 59, 0.5); padding: 0.4rem 1.2rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(5px); }

        .quick-nav { display: flex; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: center; }
        .nav-btn { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); color: #e2e8f0; padding: 0.5rem 1rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.25s ease; }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #38bdf8; transform: translateY(-2px); }

        main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
        .section-title { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem; }
        .section-title::before { content: ''; width: 5px; height: 20px; background: linear-gradient(to bottom, #38bdf8, #a855f7); border-radius: 3px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .game-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: 22px; padding: 1.6rem; height: 220px; display: flex; flex-direction: column; justify-content: space-between; opacity: 0.7; }

        footer { text-align: center; padding: 2.5rem 1rem; color: #64748b; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(15, 23, 42, 0.6); }

        /* === DYNAMIC MODAL ENGINE === */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: #1e293b; border-radius: 24px; width: 90%; max-width: 440px; padding: 2rem; text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 85vh; display: flex; flex-direction: column; position: relative;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-badge { display: inline-block; padding: 0.25rem 0.8rem; font-size: 0.75rem; font-weight: 700; border-radius: 20px; margin: 0 auto 0.8rem; text-transform: uppercase; width: fit-content; }
        .modal-icon { font-size: 3rem; margin-bottom: 0.5rem; line-height: 1; }
        .modal-title { font-size: 1.35rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.8rem; }
        .modal-message { font-size: 0.92rem; color: #cbd5e1; margin-bottom: 1.5rem; line-height: 1.6; text-align: left; overflow-y: auto; background: rgba(15, 23, 42, 0.5); padding: 1rem; border-radius: 12px; }
        
        .modal-btn { width: 100%; border: none; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; border-radius: 12px; cursor: pointer; color: #fff; transition: all 0.2s ease; }
        .modal-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        @keyframes anim-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        @keyframes anim-pulse { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="bg-dim"></div>

    <header>
        <div class="logo-container" onclick="fetchAndShowNotice()">
            <div class="logo-glow"></div>
            <img src="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" alt="Jahoe Logo" class="logo-img">
        </div>
        <h1 class="main-title-kr">자회:이기다</h1>
        <div class="main-title-en">JAHOE:WIN</div>
        <p class="sub-title">미니게임 커뮤니티 플랫폼</p>

        <div class="quick-nav">
            <button class="nav-btn" onclick="fetchAndShowNotice()">📢 공지사항 보기</button>
        </div>
    </header>

    <main>
        <div class="section-title">게임 로비</div>
        <div class="game-grid">
            <div class="game-card"><p>🎮 신규 미니게임 준비 중입니다...</p></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 자회:이기다 (JAHOE:WIN). All rights reserved.</p>
    </footer>

    <!-- 커스텀 모달 레이어 -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box" id="modalBox">
            <div class="modal-badge" id="modalBadge" style="display: none;"></div>
            <div class="modal-icon" id="modalIcon">📢</div>
            <h3 class="modal-title" id="modalTitle">공지사항</h3>
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-btn" id="modalBtn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const ANNOUNCEMENT_URL = 'https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/announcement.txt';
        let lastNoticeData = null;

        const modal = document.getElementById('customModal');
        const modalBox = document.getElementById('modalBox');
        const modalBadge = document.getElementById('modalBadge');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        // GitHub 파일 읽어오기
        async function fetchNotice(autoShow = false) {
            try {
                const response = await fetch(`${ANNOUNCEMENT_URL}?t=${new Date().getTime()}`);
                if (!response.ok) return;

                const data = await response.json();

                // 만료일 체크
                if (data.expireDate) {
                    const today = new Date().toISOString().split('T')[0];
                    if (today > data.expireDate) return; // 만료 시 표시 안 함
                }

                // 업데이트 일자가 바뀌었으면 모달 출력
                if (!lastNoticeData || lastNoticeData.updatedAt !== data.updatedAt) {
                    lastNoticeData = data;
                    if (autoShow) displayNoticeModal(data);
                }
            } catch (e) {
                console.log('공지 파일을 가져오는 중 오류 발생 또는 파일 없음');
            }
        }

        // 공지 버튼 수동 클릭 시
        async function fetchAndShowNotice() {
            await fetchNotice(false);
            if (lastNoticeData) {
                displayNoticeModal(lastNoticeData);
            } else {
                alert('등록된 공지사항이 없거나 만료되었습니다.');
            }
        }

        // 공지사항 렌더링 Engine
        function displayNoticeModal(data) {
            // 텍스트 & 아이콘
            modalIcon.innerText = data.icon || '📢';
            modalTitle.innerText = data.title || '공지사항';
            modalMessage.innerHTML = (data.content || '').replace(/\n/g, '<br>');
            modalBtn.innerText = data.btnText || '확인';

            // 카테고리 배지
            if (data.badge) {
                modalBadge.style.display = 'inline-block';
                modalBadge.innerText = data.badge;
                modalBadge.style.backgroundColor = (data.themeColor || '#38bdf8') + '25';
                modalBadge.style.color = data.themeColor || '#38bdf8';
                modalBadge.style.border = `1px solid ${data.themeColor || '#38bdf8'}60`;
            } else {
                modalBadge.style.display = 'none';
            }

            // 커스텀 박스 색상 & 스타일
            modalBox.style.backgroundColor = data.modalBgColor || '#1e293b';
            modalBtn.style.backgroundColor = data.themeColor || '#38bdf8';

            const themeColor = data.themeColor || '#38bdf8';
            if (data.borderStyle === 'glow') {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9), 0 0 30px ${themeColor}50`;
                modalBox.style.border = `1px solid ${themeColor}80`;
            } else if (data.borderStyle === 'gradient') {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9)`;
                modalBox.style.border = `2px solid ${themeColor}`;
            } else {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9)`;
                modalBox.style.border = `1px solid rgba(255, 255, 255, 0.15)`;
            }

            // 아이콘 애니메이션
            if (data.iconAnim === 'bounce') {
                modalIcon.style.animation = 'anim-bounce 1s infinite alternate';
            } else if (data.iconAnim === 'pulse') {
                modalIcon.style.animation = 'anim-pulse 1.5s infinite alternate';
            } else {
                modalIcon.style.animation = 'none';
            }

            // 버튼 클릭 동작 (링크 이동 지원)
            modalBtn.onclick = function() {
                closeModal();
                if (data.btnLink) {
                    window.open(data.btnLink, '_blank');
                }
            };

            openModal();
        }

        function openModal() { modal.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // 최초 실행 및 15초마다 새로고침 체크
        fetchNotice(true);
        setInterval(() => fetchNotice(true), 15000);
    </script>
</body>
</html>
