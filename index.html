<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자회:이기다 | JAHOE:WIN</title>
    <link rel="icon" href="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/maingamebackgroundimg.png');
            background-size: cover; background-position: center; background-repeat: no-repeat; z-index: -2;
        }
        .bg-dim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.65) 0%, rgba(15, 23, 42, 0.88) 100%); backdrop-filter: blur(6px); z-index: -1; }

        header { padding: 3rem 1rem 1.8rem; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo-container { position: relative; margin-bottom: 1.2rem; cursor: pointer; }
        .logo-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110px; height: 110px; background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, rgba(168, 85, 247, 0.3) 70%, transparent 100%); border-radius: 50%; filter: blur(15px); animation: pulseGlow 3s infinite alternate; }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        .logo-img { position: relative; width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .logo-container:hover .logo-img { transform: scale(1.12) rotate(15deg); }

        .main-title-kr { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-title-en { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: 6px; color: #94a3b8; margin-bottom: 0.8rem; }
        .sub-title { font-size: 1rem; color: #cbd5e1; background: rgba(30, 41, 59, 0.5); padding: 0.4rem 1.2rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(5px); }

        .quick-nav { display: flex; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: center; }
        .nav-btn { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); color: #e2e8f0; padding: 0.5rem 1rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.25s ease; }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #38bdf8; transform: translateY(-2px); }

        main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
        .section-title { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem; }
        .section-title::before { content: ''; width: 5px; height: 20px; background: linear-gradient(to bottom, #38bdf8, #a855f7); border-radius: 3px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .game-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: 22px; padding: 1.6rem; height: 220px; display: flex; flex-direction: column; justify-content: space-between; opacity: 0.7; }

        footer { text-align: center; padding: 2.5rem 1rem; color: #64748b; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(15, 23, 42, 0.6); }

        /* 처음 접속 시 뜨는 간지나는 시작하기 화면 (인트로) */
        #introOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #introOverlay.fade-out { opacity: 0; visibility: hidden; }

        .intro-content { text-align: center; display: flex; flex-direction: column; align-items: center; padding: 0 1.5rem; width: 100%; max-width: 400px; }
        .intro-logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(56, 189, 248, 0.6); box-shadow: 0 0 40px rgba(56, 189, 248, 0.4); margin-bottom: 1.5rem; animation: pulseGlow 2s infinite alternate; }
        .intro-title { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
        .intro-subtitle { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 5px; color: #94a3b8; margin-bottom: 2.5rem; }

        .start-btn {
            width: 100%; padding: 1.1rem; font-size: 1.1rem; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); border: none; border-radius: 16px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4); transition: all 0.3s ease;
            letter-spacing: 2px;
        }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(56, 189, 248, 0.6); filter: brightness(1.1); }

        /* 가짜 로딩 바 컨테이너 */
        .loading-container { width: 100%; margin-top: 1.5rem; display: none; flex-direction: column; align-items: center; gap: 0.6rem; }
        .loading-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15); }
        .loading-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #c084fc); transition: width 0.1s linear; }
        .loading-text { font-size: 0.85rem; color: #94a3b8; font-family: 'Orbitron', sans-serif; }

        /* 모달 공통 스타일 (배경 블러 처리 포함) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: #1e293b; border-radius: 24px; width: 90%; max-width: 440px; padding: 2rem; text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 85vh; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-badge { display: inline-block; padding: 0.25rem 0.8rem; font-size: 0.75rem; font-weight: 700; border-radius: 20px; margin: 0 auto 0.8rem; text-transform: uppercase; width: fit-content; }
        .modal-icon { font-size: 3rem; margin-bottom: 0.5rem; line-height: 1; }
        .modal-title { font-size: 1.35rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.8rem; }
        .modal-message { font-size: 0.92rem; color: #cbd5e1; margin-bottom: 1.5rem; line-height: 1.6; text-align: left; overflow-y: auto; background: rgba(15, 23, 42, 0.5); padding: 1rem; border-radius: 12px; }
        .modal-message ul, .modal-message ol { padding-left: 1.2rem; }
        
        .modal-btn { width: 100%; border: none; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; border-radius: 12px; cursor: pointer; color: #fff; transition: all 0.2s ease; }
        .modal-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* 메뉴 전용 스타일 */
        .menu-options { display: flex; flex-direction: column; gap: 0.8rem; margin: 1.2rem 0; }
        .menu-item-btn { width: 100%; padding: 0.9rem 1rem; font-size: 0.95rem; font-weight: 600; text-align: center; border-radius: 12px; background: rgba(51, 65, 85, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; cursor: pointer; transition: all 0.2s ease; }
        .menu-item-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8; transform: translateY(-2px); }

        @keyframes anim-bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        @keyframes anim-pulse { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
    </style>
</head>
<body>

    <!-- 처음 접속 시 뜨는 간지나는 시작하기 화면 (인트로) -->
    <div id="introOverlay">
        <div class="intro-content">
            <img src="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" alt="Logo" class="intro-logo">
            <h1 class="intro-title">자회:이기다</h1>
            <div class="intro-subtitle">JAHOE:WIN</div>
            
            <button class="start-btn" id="startBtn" onclick="handleGameStart()">START</button>
            
            <!-- 가짜 로딩바 -->
            <div class="loading-container" id="loadingContainer">
                <div class="loading-bar-bg">
                    <div class="loading-bar-fill" id="loadingBarFill"></div>
                </div>
                <div class="loading-text" id="loadingText">SYSTEM LOADING... 0%</div>
            </div>
        </div>
    </div>

    <!-- 배경음악 오디오 (지정된 GitHub 경로 및 무한 반복 loop 설정) -->
    <audio id="bgmAudio" loop src="https://raw.githubusercontent.com/jihuluckyman/jahoe/main/assets/sound/bgm.mp3"></audio>

    <div class="bg-overlay"></div>
    <div class="bg-dim"></div>

    <header>
        <!-- 상단 로고(합성기 모양 버튼): 클릭 시 공지 표시 -->
        <div class="logo-container" onclick="fetchAndShowNotice()">
            <div class="logo-glow"></div>
            <img src="https://raw.githubusercontent.com/jihuluckyman/jahoe/refs/heads/main/assets/image/icon.png" alt="Jahoe Logo" class="logo-img">
        </div>
        <h1 class="main-title-kr">자회:이기다</h1>
        <div class="main-title-en">JAHOE:WIN</div>
        <p class="sub-title">미니게임 커뮤니티 플랫폼</p>

        <div class="quick-nav">
            <!-- 메뉴 버튼 -->
            <button class="nav-btn" onclick="openMenuModal()">⚙️ 메뉴</button>
            <button class="nav-btn" onclick="fetchAndShowNotice()">📢 공지사항 보기</button>
        </div>
    </header>

    <main>
        <div class="section-title">게임 로비</div>
        <div class="game-grid">
            <div class="game-card"><p>🎮 신규 미니게임 준비 중입니다...</p></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 자회:이기다 (JAHOE:WIN). All rights reserved.</p>
    </footer>

    <!-- 메뉴 모달 레이어 -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal-box" style="max-width: 340px;">
            <div class="modal-icon">⚙️</div>
            <h3 class="modal-title">메뉴</h3>
            <div class="menu-options">
                <button class="menu-item-btn" id="bgmToggleBtn" onclick="toggleBgm()">🔊 배경음악 끄기</button>
                <button class="menu-item-btn" onclick="closeMenuModal(); fetchAndShowNotice();">📢 공지사항 보기</button>
            </div>
            <button class="modal-btn" onclick="closeMenuModal()" style="background: #64748b; margin-top: 0.5rem;">닫기</button>
        </div>
    </div>

    <!-- 커스텀 공지 모달 레이어 (새로고침 시 블러와 함께 뜨는 공지창) -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box" id="modalBox">
            <div class="modal-badge" id="modalBadge" style="display: none;"></div>
            <div class="modal-icon" id="modalIcon">📢</div>
            <h3 class="modal-title" id="modalTitle">공지사항</h3>
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-btn" id="modalBtn" onclick="closeNoticeModal()">확인</button>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'jihuluckyman';
        const REPO_NAME = 'jahoe';
        const FILE_PATH = 'assets/announcement.txt';

        const introOverlay = document.getElementById('introOverlay');
        const startBtn = document.getElementById('startBtn');
        const loadingContainer = document.getElementById('loadingContainer');
        const loadingBarFill = document.getElementById('loadingBarFill');
        const loadingText = document.getElementById('loadingText');

        const customModal = document.getElementById('customModal');
        const menuModal = document.getElementById('menuModal');
        const modalBox = document.getElementById('modalBox');
        const modalBadge = document.getElementById('modalBadge');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        const bgmAudio = document.getElementById('bgmAudio');
        const bgmToggleBtn = document.getElementById('bgmToggleBtn');
        let isBgmPlaying = false;

        // '시작하기(START)' 버튼 클릭 시 실행되는 가짜 로딩, 노래 재생 및 인트로 해제 + 새로고침 공지 로드 함수
        function handleGameStart() {
            startBtn.style.display = 'none';
            loadingContainer.style.display = 'flex';

            let progress = 0;
            const intervalTime = 15; 
            const loadingInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 3; 
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    loadingText.innerText = `SYSTEM READY!`;
                    loadingBarFill.style.width = `100%`;

                    // 음악 재생 및 인트로 화면 페이드아웃 후 새로고침 공지 띄우기
                    setTimeout(() => {
                        bgmAudio.play().then(() => {
                            isBgmPlaying = true;
                            bgmToggleBtn.innerText = '🔊 배경음악 끄기';
                        }).catch(err => {
                            console.log('오디오 재생 대기:', err);
                        });

                        introOverlay.classList.add('fade-out');

                        // 인트로가 사라진 후 새로고침 시점의 최신 공지 로드 및 블러 팝업 출력
                        loadAndShowNoticeOnRefresh();
                    }, 400);
                } else {
                    loadingBarFill.style.width = `${progress}%`;
                    loadingText.innerText = `SYSTEM LOADING... ${progress}%`;
                }
            }, intervalTime);
        }

        // 배경음악 토글 함수
        function toggleBgm() {
            if (bgmAudio.paused) {
                bgmAudio.play().then(() => {
                    isBgmPlaying = true;
                    bgmToggleBtn.innerText = '🔊 배경음악 끄기';
                }).catch(err => {
                    console.log('재생 실패:', err);
                });
            } else {
                bgmAudio.pause();
                isBgmPlaying = false;
                bgmToggleBtn.innerText = '🔇 배경음악 켜기';
            }
        }

        // 메뉴 모달 제어
        function openMenuModal() { menuModal.classList.add('active'); }
        function closeMenuModal() { menuModal.classList.remove('active'); }

        // GitHub API 기반 공지 파일 불러오기 유틸 (강력한 캐시 우회 적용)
        async function fetchNoticeData() {
            try {
                // 캐시 방지를 위해 URL 뒤에 현재 시간 밀리초(?t=...)를 강제로 붙입니다.
                const timestamp = new Date().getTime();
                const fileUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${timestamp}`;

                const response = await fetch(fileUrl, { 
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) return null;

                const textData = await response.text();
                return JSON.parse(textData);
            } catch (err) {
                console.error('공지 불러오기 실패:', err);
                return null;
            }
        }

        // 새로고침 시점에 공지를 불러와 블러 배경과 함께 띄우는 함수
        async function loadAndShowNoticeOnRefresh() {
            const jsonData = await fetchNoticeData();
            if (!jsonData) return;

            if (jsonData.expireDate) {
                const today = new Date().toISOString().split('T')[0];
                if (today > jsonData.expireDate) return; // 만료된 공지면 띄우지 않음
            }

            displayNoticeModal(jsonData);
        }

        // 수동 공지 호출 (로고 아이콘 또는 메뉴/버튼 클릭 시)
        async function fetchAndShowNotice() {
            const jsonData = await fetchNoticeData();
            if (jsonData) {
                if (jsonData.expireDate) {
                    const today = new Date().toISOString().split('T')[0];
                    if (today > jsonData.expireDate) {
                        alert('등록된 공지사항이 만료되었습니다.');
                        return;
                    }
                }
                displayNoticeModal(jsonData);
            } else {
                alert('공지사항을 불러올 수 없습니다.');
            }
        }

        // 공지 모달 창 렌더링 및 출력
        function displayNoticeModal(data) {
            modalIcon.innerText = data.icon || '📢';
            modalTitle.innerText = data.title || '공지사항';
            modalMessage.innerHTML = data.content || '';
            modalBtn.innerText = data.btnText || '확인';

            if (data.badge) {
                modalBadge.style.display = 'inline-block';
                modalBadge.innerText = data.badge;
                modalBadge.style.backgroundColor = (data.themeColor || '#38bdf8') + '25';
                modalBadge.style.color = data.themeColor || '#38bdf8';
                modalBadge.style.border = `1px solid ${data.themeColor || '#38bdf8'}60`;
            } else {
                modalBadge.style.display = 'none';
            }

            modalBox.style.backgroundColor = data.modalBgColor || '#1e293b';
            modalBtn.style.backgroundColor = data.themeColor || '#38bdf8';

            const themeColor = data.themeColor || '#38bdf8';
            if (data.borderStyle === 'glow') {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9), 0 0 30px ${themeColor}50`;
                modalBox.style.border = `1px solid ${themeColor}80`;
            } else if (data.borderStyle === 'gradient') {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9)`;
                modalBox.style.border = `2px solid ${themeColor}`;
            } else {
                modalBox.style.boxShadow = `0 25px 50px rgba(0,0,0,0.9)`;
                modalBox.style.border = `1px solid rgba(255, 255, 255, 0.15)`;
            }

            if (data.iconAnim === 'bounce') {
                modalIcon.style.animation = 'anim-bounce 1s infinite alternate';
            } else if (data.iconAnim === 'pulse') {
                modalIcon.style.animation = 'anim-pulse 1.5s infinite alternate';
            } else {
                modalIcon.style.animation = 'none';
            }

            modalBtn.onclick = function() {
                closeNoticeModal();
                if (data.btnLink) {
                    window.open(data.btnLink, '_blank');
                }
            };

            openNoticeModal();
        }

        function openNoticeModal() { customModal.classList.add('active'); }
        function closeNoticeModal() { customModal.classList.remove('active'); }

        customModal.addEventListener('click', (e) => { if (e.target === customModal) closeNoticeModal(); });
        menuModal.addEventListener('click', (e) => { if (e.target === menuModal) closeMenuModal(); });
    </script>
</body>
</html>
